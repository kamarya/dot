# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g mouse on

# reduce delay after Esc so vim mode switches feel instant
set -sg escape-time 10

# claude code
set -g allow-passthrough on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on

# true color support (needed for vim's termguicolors + kamary theme)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-overrides ',xterm*:Tc'
 # DESIGN TWEAKS (kamary theme)

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#00ffcd'

# copy mode
setw -g mode-style 'fg=#090c12 bg=#ffc0cb bold'

# panes
set -g pane-border-style 'fg=#403c41'
set -g pane-active-border-style 'fg=#00ffcd'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#b9d3ee bg=#090c12'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=#090c12 bg=#70b950'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=#090c12 bg=#00ffcd bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#605958 bg=#090c12'
setw -g window-status-format ' #I #[fg=#b9d3ee]#W #[fg=#ee3a8c]#F '

setw -g window-status-bell-style 'fg=#090c12 bg=#ee3a8c bold'

# messages
set -g message-style 'fg=#ffffff bg=#ee3a8c bold'
