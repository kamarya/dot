# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g mouse on

# reduce delay after Esc so vim mode switches feel instant
set -sg escape-time 10

# blinking line (bar) cursor, matching the zshrc setting so it's
# consistent whether or not the shell is running inside tmux
set -g cursor-style blinking-bar

# claude code
set -g allow-passthrough on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on

# true color support (needed for vim's termguicolors + kamary theme)
# wildcard patterns so this applies no matter what TERM the outer
# terminal reports, instead of only xterm*/xterm-256color
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -as terminal-overrides ',*:Tc'
# DESIGN TWEAKS (kamary theme)
#
# Palette pulled from vim/colors/kamary.vim, one entry per vim highlight
# group so tmux reads as the same theme as the editor rather than a
# separately-guessed set of colors:
#   090c12 Normal bg      232d45 CursorLine bg   403c41 StatusLineNC bg
#   ffffff Normal fg      605958 LineNr          777777 VertSplit fg
#   00ffcd CursorLineNr (primary accent: active window, success, borders)
#   ee3a8c PreProc/Include (alert accent: bell)
#   65c254 Question (prompt accent: messages/command-line, same role vim
#           uses it for -- y/n confirmations)
#   f0e68c/6b8e23 Visual fg/bg (copy-mode selection)
#   b9d3ee Identifier     ee3a8c PreProc        70b950 Title
#   dad085 Directory      606060 Pmenu bg

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#00ffcd'

# copy mode -- same fg/bg as vim's own Visual selection highlight
setw -g mode-style 'fg=#f0e68c bg=#6b8e23 bold'

# panes -- inactive border matches vim's VertSplit fg, active border is
# the CursorLineNr accent
set -g pane-border-style 'fg=#777777'
set -g pane-active-border-style 'fg=#00ffcd'

# popups (e.g. display-popup, fzf-tmux) -- match vim's Pmenu
set -g popup-style 'fg=#ffffff bg=#606060'
set -g popup-border-style 'fg=#00ffcd bg=#606060'

# pane-number overlay (prefix + q)
set -g display-panes-colour '#605958'
set -g display-panes-active-colour '#00ffcd'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#b9d3ee bg=#090c12'

set -g status-left '#[fg=#6495ed,bold]#S #[fg=#403c41]│#[default] '
set -g status-left-length 30

set -g status-right-style 'fg=#090c12 bg=#70b950'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=#090c12 bg=#00ffcd bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#605958 bg=#090c12'
setw -g window-status-format ' #I #[fg=#b9d3ee]#W #[fg=#ee3a8c]#F '

setw -g window-status-bell-style 'fg=#090c12 bg=#ee3a8c bold'

# messages / command-prompt line -- vim's Question color, since these are
# literally the confirmation/input prompts tmux shows the user
set -g message-style 'fg=#090c12 bg=#65c254 bold'
set -g message-command-style 'fg=#090c12 bg=#65c254 bold'
